<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇 Snake</title>
<style>
  :root{
    --bg:#0f1220; --panel:#161a2e; --text:#e8ecff; --muted:#8b93b8;
    --accent:#38e07b; --danger:#ff5d6c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 50% -10%, #1b2140, #0a0c16 60%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);padding:16px;
  }
  .game{
    width:100%;max-width:480px;background:var(--panel);
    border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:18px;
    box-shadow:0 30px 60px rgba(0,0,0,.45);
  }
  .hud{
    display:flex;align-items:stretch;gap:8px;margin-bottom:12px;
  }
  .hud.hidden{display:none;}
  .hud-cell{
    flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
    border-radius:10px;padding:6px 4px;text-align:center;min-width:0;
  }
  .hud-cell .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;white-space:nowrap;}
  .hud-cell .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pause-btn{
    flex:0 0 auto;width:48px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);
    color:var(--text);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .pause-btn:active{transform:scale(.95);}
  .board-wrap{position:relative;}
  canvas{
    width:100%;height:auto;display:block;border-radius:14px;background:#0b0e1a;
    border:1px solid rgba(255,255,255,.05);touch-action:none;
  }
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(8,10,20,.86);backdrop-filter:blur(4px);border-radius:14px;text-align:center;
    gap:12px;padding:22px;
  }
  .overlay.hidden{display:none;}
  /* 主界面/换色界面半透明，让背景蛇透出作为装饰 */
  /* 主界面去掉模糊，保证背景蛇清晰锐利 */
  #ovMenu{background:rgba(8,10,20,.42);backdrop-filter:none;-webkit-backdrop-filter:none;}
  #ovColors{background:rgba(8,10,20,.6);backdrop-filter:blur(2px);}
  .overlay h2{margin:0;font-size:24px;}
  .overlay p{margin:0;color:var(--muted);font-size:14px;line-height:1.7;}
  .rec{font-size:13px;margin:2px 0;color:var(--muted);}
  .rec span{color:var(--text);font-weight:600;}
  .overlay .big{font-size:30px;font-weight:800;color:var(--accent);display:block;margin:4px 0;}
  .controls{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;justify-content:center;}
  button{
    appearance:none;border:0;cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;
    padding:11px 18px;border-radius:12px;color:#07120b;background:var(--accent);
    transition:transform .08s ease,filter .2s ease;
  }
  button.ghost{background:rgba(255,255,255,.08);color:var(--text);}
  button:active{transform:scale(.96);}
  button:hover{filter:brightness(1.08);}
  button:disabled{opacity:.35;cursor:not-allowed;filter:none;transform:none;}
  .link{background:none;color:var(--muted);font-size:13px;padding:4px 8px;margin-top:4px;text-decoration:underline;}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:280px;}
  .lvl-btn{
    aspect-ratio:1/1;border-radius:10px;font-size:18px;font-weight:700;background:rgba(56,224,123,.15);
    color:var(--accent);border:1px solid rgba(56,224,123,.3);
  }
  .lvl-btn.locked{background:rgba(255,255,255,.04);color:var(--muted);border:1px solid rgba(255,255,255,.08);}
  .color-btn{
    display:flex;align-items:center;gap:8px;justify-content:flex-start;padding:10px 12px;font-size:14px;
    background:rgba(255,255,255,.05);color:var(--text);border:1px solid transparent;
  }
  .color-btn.active{border-color:var(--accent);background:rgba(56,224,123,.12);}
  .color-btn .dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor;}
  .hint{margin-top:12px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7;}
  .hint kbd{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:6px;
    padding:1px 7px;font-size:11px;font-family:inherit;}
  /* 右下角常驻冲刺按钮，位于地图下方、不占用地图空间 */
  .sprint-wrap{display:flex;justify-content:flex-end;margin-top:10px;}
  .sprint-btn{
    width:108px;height:48px;border-radius:24px;font-size:14px;font-weight:700;
    color:#3a2a00;background:linear-gradient(90deg,#ffae42,#ffd84d);
    box-shadow:0 6px 16px rgba(255,170,66,.35);
    user-select:none;-webkit-user-select:none;touch-action:none;
  }
  .sprint-btn:active{filter:brightness(1.12);transform:scale(.97);}
  .sprint-wrap.hidden{display:none;}
  .colors-layout{display:flex;gap:14px;width:100%;max-width:440px;align-items:flex-start;justify-content:center;}
  .color-list{flex:1;display:flex;flex-direction:column;gap:7px;max-height:300px;overflow-y:auto;padding-right:4px;}
  .color-list .color-btn{padding:8px 10px;font-size:13px;}
  .color-preview{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:7px;}
  #colorPreview{width:142px;height:142px;border-radius:12px;background:#0b0e1a;border:1px solid rgba(255,255,255,.08);}
  .color-preview .pv-label{font-size:12px;color:var(--muted);}
  .hud{flex-wrap:wrap;}
  .status-row{flex:1 1 100%;display:flex;align-items:center;gap:10px;margin-top:2px;}
  .stamina{display:flex;align-items:center;gap:6px;flex:1;}
  .st-lbl{font-size:10px;color:var(--muted);white-space:nowrap;}
  .st-track{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;}
  .st-fill{height:100%;width:100%;background:linear-gradient(90deg,#ffd84d,#ff8a3d);transition:width .08s linear;}
  .lives{display:flex;gap:5px;}
  .life-dot{width:12px;height:12px;border-radius:50%;background:var(--danger);box-shadow:0 0 6px var(--danger);}
  .item-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;text-align:left;}
  .item-row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:10px 12px;}
  .item-dot{width:18px;height:18px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor;}
  .item-row b{font-size:14px;}
  .item-row div{font-size:12px;color:var(--muted);line-height:1.5;}
</style>
</head>
<body>
  <div class="game">
    <div class="hud hidden" id="hud">
      <div class="hud-cell"><div class="lbl">模式</div><div class="v" id="hudMode">-</div></div>
      <div class="hud-cell"><div class="lbl" id="hudScoreLbl">分数</div><div class="v" id="hudScore">0</div></div>
      <div class="hud-cell"><div class="lbl">用时</div><div class="v" id="hudTime">00:00</div></div>
      <div class="hud-cell"><div class="lbl">连击</div><div class="v" id="hudCombo">0</div></div>
      <div class="hud-cell"><div class="lbl" id="hudBestLbl">最高</div><div class="v" id="hudBest">0</div></div>
      <button class="pause-btn" id="btnPause">暂停</button>
      <div class="status-row">
        <div class="stamina"><span class="st-lbl">体力</span><div class="st-track"><div class="st-fill" id="hudStaminaFill"></div></div></div>
        <div class="lives" id="hudLives"></div>
      </div>
    </div>

    <div class="board-wrap">
      <canvas id="board" width="600" height="600"></canvas>

      <div class="overlay" id="ovMenu">
        <h2>贪吃蛇</h2>
        <p class="rec">关卡 · <span id="menuCampaign">已到达第 1 关</span></p>
      <p class="rec">无限 · <span id="menuEndless">暂无纪录</span></p>
        <div class="controls">
          <button id="btnStart">开始游戏</button>
          <button id="btnColor" class="ghost">更换颜色</button>
          <button id="btnItems" class="ghost">道具查看</button>
        </div>
      </div>

      <div class="overlay hidden" id="ovMode">
        <h2>选择模式</h2>
        <div class="controls">
          <button id="btnCampaign">关卡模式</button>
          <button id="btnEndless" class="ghost">无限模式</button>
        </div>
        <button class="link" id="btnModeBack">返回</button>
      </div>

      <div class="overlay hidden" id="ovLevels">
        <h2>选择关卡</h2>
        <p style="font-size:12px">只有到达过的关卡才能选择</p>
        <div class="grid" id="levelGrid"></div>
        <button class="link" id="btnLevelsBack">返回</button>
      </div>

      <div class="overlay hidden" id="ovColors">
        <h2>更换蛇颜色</h2>
        <div class="colors-layout">
          <div class="color-list" id="colorGrid"></div>
          <div class="color-preview">
            <canvas id="colorPreview" width="284" height="284"></canvas>
            <span class="pv-label">实时预览</span>
          </div>
        </div>
        <button class="link" id="btnColorsBack">返回</button>
      </div>

      <div class="overlay hidden" id="ovItems">
        <h2>道具说明</h2>
        <div class="item-list">
          <div class="item-row"><span class="item-dot" style="background:#b06bff;color:#b06bff"></span><div><b>紫果</b><br>立刻刷新障碍一次</div></div>
          <div class="item-row"><span class="item-dot" style="background:#3dff7a;color:#3dff7a"></span><div><b>绿果</b><br>回复一点生命值（不超过上限）</div></div>
          <div class="item-row"><span class="item-dot" style="background:#ffae42;color:#ffae42"></span><div><b>橙果</b><br>10秒内冲刺不消耗体力</div></div>
        </div>
        <button class="link" id="btnItemsBack">返回</button>
      </div>

      <div class="overlay hidden" id="ovPause">
        <h2>已暂停</h2>
        <p>按 <kbd>P</kbd> 或点击继续</p>
        <div class="controls">
          <button id="btnResume">继续</button>
          <button id="btnPauseQuit" class="ghost">退出</button>
        </div>
      </div>

      <div class="overlay hidden" id="ovResult">
        <h2 id="rsTitle">游戏结束</h2>
        <p id="rsDesc"></p>
        <div class="controls" id="rsBtns"></div>
      </div>
    </div>

    <div class="sprint-wrap hidden">
      <button id="btnSprint" class="sprint-btn">按住冲刺</button>
    </div>

    <div class="hint">
      <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd>/<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 ·
      <kbd>空格</kbd> 加速 · <kbd>P</kbd> 暂停 · 手机滑动或右下角按钮
      <div style="margin-top:6px">🟣紫果：刷新障碍 · 💚绿果：回血 · 🍊橙果：10s冲刺免耗体力</div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  const canvas=document.getElementById('board');
  const ctx=canvas.getContext('2d');
  const CW=canvas.width; // 600

  /* ---------- 配色方案 ---------- */
  const SCHEMES=[
    {id:'green',  name:'经典绿', head:'#5dffa0', body:[56,224,123],  food:'#ff3d57'},
    {id:'cyan',   name:'霓虹蓝', head:'#7df9ff', body:[43,212,255],  food:'#ffb13d'},
    {id:'flame',  name:'火焰橙', head:'#ffd166', body:[255,107,53],  food:'#5dffa0'},
    {id:'sakura', name:'樱花粉', head:'#ff9ecd', body:[255,120,180], food:'#7df9ff'},
    {id:'purple', name:'暗夜紫', head:'#c792ea', body:[167,139,250], food:'#ffd166'},
    {id:'lime',   name:'青柠绿', head:'#cdff4d', body:[200,255,70],  food:'#ff3d57'},
    {id:'gold',   name:'流金',   head:'#ffd84d', body:[255,200,50],  food:'#38e07b'},
    {id:'crimson',name:'烈焰红', head:'#ff7a7a', body:[240,70,70],   food:'#5dffa0'},
    {id:'ocean',  name:'海洋蓝', head:'#6fb1ff', body:[56,132,255],  food:'#ffd166'},
    {id:'mint',   name:'薄荷绿', head:'#9af5cf', body:[120,231,183], food:'#ff3d57'},
    {id:'sunset', name:'晚霞粉', head:'#ffb27a', body:[255,140,70],  food:'#7df9ff'}
  ];
  let currentScheme=SCHEMES[0];

  /* ---------- 持久化 ---------- */
  let unlocked     =Math.min(10,Math.max(1,parseInt(localStorage.getItem('snake_unlocked')||'1',10)));
  let campaign_cleared = localStorage.getItem('snake_campaign_cleared')==='1';
  let endless_rec = null;
  try { const r=localStorage.getItem('snake_endless_rec'); if(r) endless_rec=JSON.parse(r); } catch(e){}
  (function(){
    const cid=localStorage.getItem('snake_color');
    if(cid){ const s=SCHEMES.find(x=>x.id===cid); if(s) currentScheme=s; }
  })();

  /* ---------- 关卡配置 ---------- */
  function levelConfig(level){
    const size = level<=4 ? 21 : level<=9 ? 25 : 30;   // 每5关变大，最大30
    const target = 200 + (level-1)*200;                // 关1=200，关10=2000，线性递增
    const obstacles = 4 + (level-1)*2;                 // 障碍随关卡增多
    return {size, target, obstacles};
  }

  /* ---------- 游戏状态 ---------- */
  let cols=21, rows=21, CELL=CW/cols;
  let snake, dir, food, obstacles, pending;
  let score=0, totalScore=0, target=0, level=0, mode='campaign';
  let speed=130, running=false, paused=false, boosting=false, boostTouch=false;
  let elapsed=0, acc=0, lastTs=0;
  let menuAcc=0;      // 主界面背景蛇移动累计(ms)
  let heldDirs=[];    // 当前仍按住的方向键（按按下顺序，最后为最近按下）
  let obstacleCycle=0;     // 障碍刷新周期计时(ms)
  let obstacleWarned=false; // 是否已发出刷新预警
  let items=[];        // 场上道具 [{x,y,type}]
  let itemTimer=0;     // 道具生成计时
  let stamina=10, staminaMax=10;   // 体力
  let lives=3, livesMax=3;         // 生命
  let noStaminaTimer=0; // 橙果：冲刺免耗体力剩余时间(ms)
  let invincibleTimer=0; // 受伤后无敌剩余时间(ms)
  let toast=null;      // 画布提示 {txt,t,color}
  // 连击系统
  let comboCount=0;    // 当前连击数（1~5）
  let comboTimer=0;    // 连击窗口剩余时间(ms)，>0 表示处于连击窗口内
  // 冲刺分段
  let boostTimer=0;    // 当前冲刺已持续(ms)
  let boostPhase='double'; // 'double'(前1秒2倍) | 'normal'(之后1.5倍匀速)
  let sprintingActive=false; // 本次冲刺是否已发起（用于发起瞬间固定 -2）

  /* ---------- 工具 ---------- */
  const key=(x,y)=>x+','+y;

  function reachable(sx,sy,tx,ty,block){
    const visited=new Set([key(sx,sy)]);
    const q=[[sx,sy]];
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    while(q.length){
      const [x,y]=q.shift();
      if(x===tx&&y===ty) return true;
      for(const [dx,dy] of dirs){
        let nx=(x+dx+cols)%cols, ny=(y+dy+rows)%rows; // 穿墙
        const k=key(nx,ny);
        if(visited.has(k)||block.has(k)) continue;
        visited.add(k); q.push([nx,ny]);
      }
    }
    return false;
  }

  function freeCells(exclude){
    const out=[];
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
      const k=key(x,y);
      if(exclude.has(k)) continue;
      out.push([x,y]);
    }
    return out;
  }

  // 生成障碍，保证蛇头能到达食物（不堵食物）
  function genObstacles(count, exclude){
    const occupied=new Set(exclude);
    const free=freeCells(occupied);
    let fallback=null;
    for(let attempt=0;attempt<40;attempt++){
      const pool=free.slice();
      const cand=new Set();
      for(let i=0;i<count && pool.length;i++){
        const idx=Math.floor(Math.random()*pool.length);
        const [x,y]=pool.splice(idx,1)[0];
        cand.add(key(x,y));
      }
      const block=new Set(cand);
      for(let i=1;i<snake.length;i++) block.add(key(snake[i].x,snake[i].y)); // 蛇身不可穿
      if(reachable(snake[0].x,snake[0].y, food.x,food.y, block)) return cand;
      fallback=cand;
    }
    return fallback;
  }

  function spawnFood(){
    const exclude=new Set();
    snake.forEach(s=>exclude.add(key(s.x,s.y)));
    obstacles.forEach(k=>exclude.add(k));
    if(pending) pending.forEach(p=>exclude.add(key(p.x,p.y)));
    const free=freeCells(exclude);
    if(!free.length) return {x:0,y:0};
    const [x,y]=free[Math.floor(Math.random()*free.length)];
    return {x,y};
  }

  // 周期生成随机道具（避开蛇身、障碍、食物、预警、其他道具）
  function spawnItem(){
    const types=['purple','green','orange'];
    const type=types[Math.floor(Math.random()*types.length)];
    const exclude=new Set();
    snake.forEach(s=>exclude.add(key(s.x,s.y)));
    obstacles.forEach(k=>exclude.add(k));
    exclude.add(key(food.x,food.y));
    if(pending) pending.forEach(p=>exclude.add(key(p.x,p.y)));
    items.forEach(it=>exclude.add(key(it.x,it.y)));
    const free=freeCells(exclude);
    if(!free.length) return;
    const [x,y]=free[Math.floor(Math.random()*free.length)];
    items.push({x,y,type});
  }
  function applyItem(type){
    if(type==='purple'){
      // 触发障碍刷新预警：先高亮2秒，再由 updateObstacleCycle 生效（与周期刷新一致）
      const count = mode==='endless' ? 12 : (level>0 ? levelConfig(level).obstacles : 10);
      prepareObstacleWarning(count);
      obstacleCycle = 8000; // CYCLE-2000，2秒后由 updateObstacleCycle 生效
      showToast('障碍物即将刷新！','#b06bff');
    } else if(type==='green'){
      if(lives<livesMax){ lives++; updateLivesUI(); showToast('生命 +1','#3dff7a'); }
      else showToast('生命已满','#3dff7a');
    } else if(type==='orange'){
      noStaminaTimer=10000; showToast('10秒冲刺免耗体力','#ffae42');
    }
  }

  // 生成障碍刷新预警：提前高亮即将生成的障碍位置（不堵食物），并设置 obstacleWarned
  function prepareObstacleWarning(count){
    const set=genObstacles(count, new Set([key(food.x,food.y)]));
    pending = set ? [...set].map(k=>{const[a,b]=k.split(',').map(Number);return {x:a,y:b};}) : [];
    obstacleWarned=true;
  }

  function showToast(txt,color){ toast={txt, t:Date.now(), color:color||'#ff7a7a'}; }
  // 加分（含连击累进）：窗口内(5s)连续加分且未扣分则 +10/+20/+30/+40/+50，5连后保持+50
  function gainScore(){
    if(comboTimer>0 && comboCount<5) comboCount++;        // 窗口内且未满级 -> 连击+1
    else if(comboTimer<=0) comboCount=1;                   // 超时 -> 从1重新开始
    const add=10+(comboCount-1)*10;                       // 10,20,30,40,50
    score+=add; if(mode==='campaign') totalScore+=add;
    comboTimer=5000;                                      // 刷新5秒窗口
    updateHud();
    showToast('+'+add+(comboCount>1?(' 连击x'+comboCount):''), '#ffd84d');
  }
  // 扣分：扣10分并重置连击
  function loseScore(){
    const sub=10;
    score=Math.max(0,score-sub); if(mode==='campaign') totalScore=Math.max(0,totalScore-sub);
    comboCount=0; comboTimer=0;
    updateHud();
  }

  /* ---------- 场景搭建 ---------- */
  function placeSnake(){
    const cx=Math.floor(cols/2), cy=Math.floor(rows/2);
    snake=[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
    dir={x:1,y:0}; heldDirs=[];
  }

  function setupGame(opt){
    cols=opt.cols; rows=opt.rows; CELL=CW/cols;
    speed=opt.speed; mode=opt.mode; level=opt.level||0; target=opt.target||0;
    placeSnake();
    obstacles=new Set();
    pending=null;
    food=spawnFood();
    if(opt.obstacleCount>0){
      const set=genObstacles(opt.obstacleCount, new Set([key(food.x,food.y)]));
      if(set) obstacles=set;
    }
    score=0; elapsed=0; acc=0; boosting=false; boostTouch=false; comboCount=0; comboTimer=0; boostTimer=0; boostPhase='double'; sprintingActive=false;
    obstacleCycle=0; obstacleWarned=false; // 重置障碍刷新周期（关卡与无限模式共用）
    items=[]; itemTimer=0; stamina=staminaMax; lives=livesMax; noStaminaTimer=0; invincibleTimer=3000; toast=null; showToast('开局无敌','#cfd6ff');
    updateHud();
  }

  function setupMenuBg(){
    cols=21; rows=21; CELL=CW/cols; mode='menu';
    // 主界面背景蛇：固定长度 10，水平排开作为装饰
    const cx=Math.floor(cols/2), cy=Math.floor(rows/2);
    snake=[];
    for(let i=0;i<10;i++) snake.push({x:cx-i,y:cy});
    dir={x:1,y:0}; heldDirs=[];
    obstacles=new Set(); pending=null; items=[]; food=null; menuAcc=0;
    invincibleTimer=0; toast=null; // 清除残留的无敌闪烁/提示
    draw();
  }

  /* ---------- 换色预览 ---------- */
  const pvCanvas=document.getElementById('colorPreview');
  const pvCtx=pvCanvas.getContext('2d');
  function drawColorPreview(){
    const W=pvCanvas.width, n=11, st=W/n;
    pvCtx.fillStyle='#0b0e1a'; pvCtx.fillRect(0,0,W,W);
    pvCtx.strokeStyle='rgba(255,255,255,.04)'; pvCtx.lineWidth=1;
    for(let i=1;i<n;i++){
      pvCtx.beginPath(); pvCtx.moveTo(i*st,0); pvCtx.lineTo(i*st,W); pvCtx.stroke();
      pvCtx.beginPath(); pvCtx.moveTo(0,i*st); pvCtx.lineTo(W,i*st); pvCtx.stroke();
    }
    const cells=[
      {x:7,y:3},{x:6,y:3},{x:5,y:3},{x:4,y:3},
      {x:4,y:4},{x:5,y:4},{x:6,y:4},{x:7,y:4},{x:7,y:5}
    ];
    const dir={x:-1,y:0};
    for(let i=cells.length-1;i>=0;i--){
      const s=cells[i], x=s.x*st, y=s.y*st, t=i/cells.length;
      pvCtx.fillStyle = i===0 ? currentScheme.head : bodyColor(t);
      roundRect(pvCtx,x+1,y+1,st-2,st-2, i===0?4:3); pvCtx.fill();
    }
    const h=cells[0], ex=h.x*st, ey=h.y*st;
    pvCtx.fillStyle='#0b0e1a';
    const e1x=ex+st/2+dir.x*2.6-dir.y*2.6, e1y=ey+st/2+dir.y*2.6-dir.x*2.6;
    const e2x=ex+st/2+dir.x*2.6+dir.y*2.6, e2y=ey+st/2+dir.y*2.6+dir.x*2.6;
    pvCtx.beginPath(); pvCtx.arc(e1x,e1y,1.8,0,Math.PI*2); pvCtx.fill();
    pvCtx.beginPath(); pvCtx.arc(e2x,e2y,1.8,0,Math.PI*2); pvCtx.fill();
    const f={x:2,y:2};
    pvCtx.fillStyle=currentScheme.food;
    pvCtx.beginPath(); pvCtx.arc(f.x*st+st/2,f.y*st+st/2,st/2-2,0,Math.PI*2); pvCtx.fill();
  }

  /* ---------- 流程控制 ---------- */
  function showOverlay(id){
    document.querySelectorAll('.overlay').forEach(o=>o.classList.add('hidden'));
    if(id) document.getElementById(id).classList.remove('hidden');
  }
  function showHud(v){ document.getElementById('hud').classList.toggle('hidden',!v); }
  function showSprint(v){ const el=document.getElementById('btnSprint'); if(el) el.parentElement.classList.toggle('hidden',!v); }

  function updateMenuBest(){
    document.getElementById('menuCampaign').textContent = campaign_cleared ? '已通关' : ('已到达第 '+unlocked+' 关');
    const e=document.getElementById('menuEndless');
    if(endless_rec) e.textContent='在 '+fmtTime(endless_rec.time)+' 内获得 '+endless_rec.score+' 分';
    else e.textContent='暂无纪录';
  }
  function gotoMenu(){
    running=false; paused=false; boosting=false; boostTouch=false; showHud(false); showSprint(false);
    updateMenuBest();
    showOverlay('ovMenu'); setupMenuBg();
  }
  function gotoMode(){ showOverlay('ovMode'); }
  function gotoLevels(){ renderLevels(); showOverlay('ovLevels'); }

  function startCampaign(lv, carry){
    if(!carry) totalScore=0;
    const c=levelConfig(lv);
    setupGame({cols:c.size,rows:c.size,target:c.target,obstacleCount:c.obstacles,
               speed:Math.max(80,140-(lv-1)*6),mode:'campaign',level:lv});
    running=true; paused=false; showHud(true); showSprint(true); showOverlay(null);
  }
  function startEndless(){
    totalScore=0;
    setupGame({cols:30,rows:30,obstacleCount:12,speed:110,mode:'endless',level:0});

  }

  function pauseGame(){
    if(!running||paused) return;
    paused=true; boosting=false; boostTouch=false; showSprint(false); showOverlay('ovPause');
  }
  function resumeGame(){
    if(!running||!paused) return;

  }

  function levelClear(){
    running=false; boosting=false; boostTouch=false; showSprint(false);
    const btns=document.getElementById('rsBtns'); btns.innerHTML='';
    document.getElementById('rsTitle').textContent='恭喜通关！';
    if(level<10){
      unlocked=Math.max(unlocked,level+1); localStorage.setItem('snake_unlocked',unlocked);
      document.getElementById('rsDesc').innerHTML='第 '+level+' 关达成<br>本关 '+score+' 分 · 总分 '+totalScore;
      addBtn(btns,'下一关',()=>startCampaign(level+1,true));
    } else {
      campaign_cleared=true; localStorage.setItem('snake_campaign_cleared','1');
      document.getElementById('rsDesc').innerHTML='第 10 关达成 · 全部通关！<br>本关 '+score+' 分 · 总分 '+totalScore;
    }

  function gameOver(){
    running=false; boosting=false; boostTouch=false; showSprint(false);
    let newRec=false;
    if(mode==='campaign'){
      unlocked=Math.max(unlocked, level); localStorage.setItem('snake_unlocked',unlocked);
    } else {
      newRec=!endless_rec || score>endless_rec.score;
      if(newRec){ endless_rec={score:score, time:Math.floor(elapsed)}; localStorage.setItem('snake_endless_rec',JSON.stringify(endless_rec)); }
    }
    document.getElementById('rsTitle').textContent='游戏结束';
    const desc=document.getElementById('rsDesc');
    if(mode==='campaign'){
      desc.innerHTML='本局结束 · 总分 '+totalScore+'<br>已到达第 '+unlocked+' 关';
    } else {
      let s='得分 '+score+' 分';
      if(endless_rec) s+='<br>最高纪录：在 '+fmtTime(endless_rec.time)+' 内获得 '+endless_rec.score+' 分';
      if(newRec) s+='<br><b style="color:var(--accent)">新纪录！</b>';

  function addBtn(parent,label,fn,ghost){
    const b=document.createElement('button');
    b.textContent=label; if(ghost) b.className='ghost';
    b.onclick=fn; parent.appendChild(b);
  }

  /* ---------- 渲染 ---------- */
  function roundRect(c,x,y,w,h,r){
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }
  function bodyColor(t){
    const [r,g,b]=currentScheme.body;
    const k=1-t*0.45;
    return 'rgb('+Math.round(r*k)+','+Math.round(g*k)+','+Math.round(b*k)+')';
  }
  function draw(){
    ctx.fillStyle='#0b0e1a';
    ctx.fillRect(0,0,CW,CW);
    ctx.strokeStyle='rgba(255,255,255,.03)'; ctx.lineWidth=1;
    for(let i=1;i<cols;i++){
      ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,CW); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(CW,i*CELL); ctx.stroke();
    }
    // 预警障碍（高亮闪烁）
    if(pending&&pending.length){
      const on=Math.floor(Date.now()/200)%2===0;
      ctx.fillStyle=on?'rgba(255,93,108,.55)':'rgba(255,93,108,.22)';
      for(const p of pending){
        roundRect(ctx,p.x*CELL+2,p.y*CELL+2,CELL-4,CELL-4,5); ctx.fill();
      }
    }
    // 实体障碍
    if(obstacles){
      ctx.fillStyle='rgba(140,150,190,.55)';
      for(const k of obstacles){
        const [x,y]=k.split(',').map(Number);
        roundRect(ctx,x*CELL+2,y*CELL+2,CELL-4,CELL-4,5); ctx.fill();
      }
    }
    // 食物（菜单模式无食物，跳过）
    if(food){
    const fx=food.x*CELL+CELL/2, fy=food.y*CELL+CELL/2;
    const fg=ctx.createRadialGradient(fx,fy,2,fx,fy,CELL/1.4);
    fg.addColorStop(0,currentScheme.food); fg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=fg;
    ctx.beginPath(); ctx.arc(fx,fy,CELL/2-2,0,Math.PI*2); ctx.fill();
    }
    // 道具（紫=刷新障碍，绿=回血，橙=免耗体力）
    for(const it of items){
      const ix=it.x*CELL+CELL/2, iy=it.y*CELL+CELL/2;
      const col = it.type==='purple'?'#b06bff' : it.type==='green'?'#3dff7a' : '#ffae42';
      const rg=ctx.createRadialGradient(ix,iy,1,ix,iy,CELL/1.2);
      rg.addColorStop(0,col); rg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=rg;
      ctx.beginPath(); ctx.arc(ix,iy,CELL/2-1,0,Math.PI*2); ctx.fill();
      const pr=(Date.now()%1000)/1000;
      ctx.save();
      ctx.globalAlpha=0.7-pr*0.7;
      ctx.strokeStyle=col; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(ix,iy,CELL/2-3+pr*4,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    // 蛇
    for(let i=snake.length-1;i>=0;i--){
      const s=snake[i], x=s.x*CELL, y=s.y*CELL, t=i/snake.length;
      ctx.fillStyle = i===0 ? currentScheme.head : bodyColor(t);
      roundRect(ctx,x+1,y+1,CELL-2,CELL-2, i===0?7:5); ctx.fill();
    }
    // 受伤无敌闪烁高亮
    if(invincibleTimer>0){
      const a=0.18+0.18*Math.abs(Math.sin(Date.now()/110));
      ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='#ffffff';
      for(const s of snake){ roundRect(ctx,s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2,5); ctx.fill(); }
      ctx.restore();
    }
    // 眼睛
    const h=snake[0];
    ctx.fillStyle='#0b0e1a';
    const ex=h.x*CELL, ey=h.y*CELL;
    const e1x=ex+CELL/2+dir.x*4-dir.y*4, e1y=ey+CELL/2+dir.y*4-dir.x*4;
    const e2x=ex+CELL/2+dir.x*4+dir.y*4, e2y=ey+CELL/2+dir.y*4+dir.x*4;
    ctx.beginPath(); ctx.arc(e1x,e1y,2.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(e2x,e2y,2.4,0,Math.PI*2); ctx.fill();
    // 提示文字
    if(toast){
      const age=Date.now()-toast.t;
      if(age<1300){
        ctx.save();
        ctx.globalAlpha=Math.max(0,1-age/1300);
        ctx.fillStyle=toast.color||'#ff7a7a';
        ctx.font='bold 30px sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(toast.txt, CW/2, CW-30);
        ctx.restore();
      }
    }
  }

  /* ---------- HUD ---------- */
  function fmtTime(ms){
    const s=Math.floor(ms/1000), m=Math.floor(s/60);
    return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  }
  function updateHud(){
    if(mode==='campaign'){
      document.getElementById('hudMode').textContent='第'+level+'关';
      document.getElementById('hudScoreLbl').textContent='分数/目标';
      document.getElementById('hudScore').textContent=score+'/'+target;
      document.getElementById('hudBestLbl').textContent='最高关';
      document.getElementById('hudBest').textContent=unlocked;
    } else if(mode==='endless'){
      document.getElementById('hudMode').textContent='无限模式';
      document.getElementById('hudScoreLbl').textContent='分数';
      document.getElementById('hudScore').textContent=score;
      document.getElementById('hudBestLbl').textContent='最高分';
      document.getElementById('hudBest').textContent=endless_rec?endless_rec.score:0;
    }
    updateLivesUI();
  }
  function updateLivesUI(){
    const el=document.getElementById('hudLives'); if(!el) return;
    el.innerHTML='';
    for(let i=0;i<lives;i++){
      const d=document.createElement('span'); d.className='life-dot'; el.appendChild(d);
    }
  }

  /* ---------- 主循环 ---------- */
  function tick(){
    const hd=currentHeldDir();
    if(hd) dir=hd;
    let nx=snake[0].x+dir.x, ny=snake[0].y+dir.y;
    // 穿墙：从对侧出现（边缘不视为墙，不扣分、不断连击）
    nx=(nx+cols)%cols; ny=(ny+rows)%rows;
    const head={x:nx,y:ny};
    const invincible = invincibleTimer>0;
    // 自撞：无敌期间仅截断不掉血；否则扣生命，生命耗尽才死
    const hitIdx=snake.findIndex(s=>s.x===nx&&s.y===ny);
    if(hitIdx>=0){
      snake=snake.slice(0,hitIdx); // 从碰撞点截断蛇身
      loseScore(); // 碰身体：扣10分并重置连击
      if(invincible){
        showToast('蛇身截断','#cfd6ff');
      } else {
        lives--;
        if(lives<=0){ lives=0; updateLivesUI(); updateHud(); return gameOver(); }
        showToast('生命 -1 · 蛇身截断','#ff7a7a');
        invincibleTimer=3000; // 进入 3 秒无敌
      }
      updateLivesUI();
    }
    // 撞障碍（"墙"）：无敌期间击碎不掉血不掉分；否则扣生命并扣10分（耗尽才死）
    if(obstacles.has(key(nx,ny))){
      obstacles.delete(key(nx,ny)); // 击碎障碍，蛇得以继续
      if(invincible){
        showToast('障碍击碎','#9af5cf');
      } else {
        lives--;
        loseScore(); // 碰墙扣分 -10 并重置连击
        if(lives<=0){ lives=0; updateLivesUI(); updateHud(); return gameOver(); }
        showToast('生命 -1 · 障碍','#ff7a7a');
        invincibleTimer=3000;
      }
      updateLivesUI();
    }
    snake.unshift(head);
    // 吃道具
    const hit=items.find(it=>it.x===nx&&it.y===ny);
    if(hit){ items=items.filter(it=>it!==hit); applyItem(hit.type); gainScore(); }
    let grew=false;
    if(nx===food.x&&ny===food.y){
      gainScore();
      if(mode==='campaign'&&score>=target) return levelClear();
      food=spawnFood();
      grew=true;
    }
    if(hit) grew=true; // 道具也增长身体长度
    if(!grew) snake.pop();
  }

  // 障碍刷新周期（关卡与无限模式共用）：每10秒清空并重生成，提前2秒高亮预警，生成不堵食物/蛇身
  function updateObstacleCycle(dt, count){
    const CYCLE=10000;
    obstacleCycle+=dt;
    if(!obstacleWarned && obstacleCycle>=CYCLE-2000){
      prepareObstacleWarning(count); // 提前2秒高亮即将生成的障碍（不堵食物）
    }
    if(obstacleCycle>=CYCLE){
      // 清空旧障碍，生效新障碍
      obstacles=new Set(pending.map(p=>key(p.x,p.y)));
      snake.forEach(s=>obstacles.delete(key(s.x,s.y))); // 避免压在蛇身上
      pending=null;
      obstacleCycle=0; obstacleWarned=false;
      // 若食物被新障碍覆盖，重新生成食物
      if(obstacles.has(key(food.x,food.y))) food=spawnFood();
    }
  }

  // 主界面背景蛇：可 WASD/方向键操控，穿墙，纯装饰（无食物/障碍/道具）
  function menuTick(dt){
    const step=150; // 移动间隔(ms)
    menuAcc+=dt;
    while(menuAcc>=step){
      menuAcc-=step;
      const hd=currentHeldDir();
      if(hd) dir=hd; // 跟随最近按住的、非反向方向（长按+切键可回退）
      let nx=snake[0].x+dir.x, ny=snake[0].y+dir.y;
      nx=(nx+cols)%cols; ny=(ny+rows)%rows; // 碰墙从对侧出现
      snake.unshift({x:nx,y:ny});
      snake.pop(); // 无食物，长度不变
    }
  }

  function loop(ts){
    requestAnimationFrame(loop);
    let dt=ts-lastTs; lastTs=ts;
    if(dt>200) dt=200; // 防止切后台后跳跃
    if(mode==='menu'){ menuTick(dt); draw(); return; } // 主界面背景蛇动画
    if(!running){ return; }
    if(paused) return;
    elapsed+=dt;
    // 障碍刷新周期：无限模式固定12个，关卡模式用本关障碍数
    if(mode==='endless') updateObstacleCycle(dt, 12);
    else if(mode==='campaign') updateObstacleCycle(dt, levelConfig(level).obstacles);
    // 计时器衰减
    if(noStaminaTimer>0) noStaminaTimer=Math.max(0,noStaminaTimer-dt);
    if(invincibleTimer>0) invincibleTimer=Math.max(0,invincibleTimer-dt); // 受伤无敌倒计时
    if(comboTimer>0) comboTimer=Math.max(0,comboTimer-dt); // 连击窗口倒计时
    // 冲刺与体力：体力≥2才能发起；橙果期间可无条件发起且免耗
    const canSprint = noStaminaTimer>0 || stamina>=2;
    const sprinting = boosting && canSprint;
    if(sprinting){
      if(!sprintingActive){            // 刚发起本次冲刺：固定先 -2
        sprintingActive=true;
        if(noStaminaTimer<=0) stamina=Math.max(0, stamina-2);
      }
      boostTimer+=dt;
      if(boostPhase==='double'){
        if(boostTimer>=1000) boostPhase='normal'; // 前1秒2倍（免费）
      } else if(noStaminaTimer<=0){
        stamina=Math.max(0, stamina-dt/1000); // 之后1.5倍匀速持续消耗
        if(stamina<=0){ boosting=false; boostTouch=false; } // 体力耗尽停止冲刺
      }
    } else {
      sprintingActive=false; boostTimer=0; boostPhase='double';
      if(noStaminaTimer<=0) stamina=Math.min(staminaMax, stamina+dt/1000); // 未冲刺回体力
    }
    // 道具生成（场上同时最多 2 个，每 12 秒尝试生成一个）
    itemTimer+=dt;
    if(items.length<2 && itemTimer>=12000){ itemTimer=0; spawnItem(); }
    // 速度：冲刺前1秒2倍，之后1.5倍，否则常速
    const mult = sprinting ? (boostPhase==='double'?2:1.5) : 1;
    const step = speed / mult;
    // 体力条 UI
    const sf=document.getElementById('hudStaminaFill');
    sf.style.width=(stamina/staminaMax*100)+'%';
    sf.style.background = noStaminaTimer>0 ? 'linear-gradient(90deg,#ffae42,#ffd84d)' : '';
    // 连击数 UI
    const cb=document.getElementById('hudCombo'); if(cb) cb.textContent = comboTimer>0 ? comboCount : 0;
    acc+=dt;
    while(acc>=step){ acc-=step; tick(); if(!running) break; }
    document.getElementById('hudTime').textContent=fmtTime(elapsed);
    draw();
  }

  /* ---------- 输入：支持「长按某方向时按另一方向切换，松开后回退到仍按住的方向」 ---------- */
  // heldDirs：当前仍按住的方向（按下顺序，最后一个是最近按下）；松键即移除
  function dirNameToVec(name){
    return name==='up'?{x:0,y:-1} : name==='down'?{x:0,y:1} : name==='left'?{x:-1,y:0} : {x:1,y:0};
  }
  function pressDir(name){
    heldDirs=heldDirs.filter(d=>d!==name); // 去重并移到末尾（视为最新按下）
    heldDirs.push(name);
  }
  function releaseDir(name){ heldDirs=heldDirs.filter(d=>d!==name); }
  // 取最近一个「非 180° 反向」的按住方向作为目标方向；为空或全部反向则返回 null（保持当前方向）
  function currentHeldDir(){
    for(let i=heldDirs.length-1;i>=0;i--){
      const v=dirNameToVec(heldDirs[i]);
      if(!(v.x===-dir.x && v.y===-dir.y)) return v;
    }
    return null;
  }
  window.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    const active=(running&&!paused)||mode==='menu';
    if(['arrowup','w'].includes(k)){ if(active){ pressDir('up'); e.preventDefault(); } }
    else if(['arrowdown','s'].includes(k)){ if(active){ pressDir('down'); e.preventDefault(); } }
    else if(['arrowleft','a'].includes(k)){ if(active){ pressDir('left'); e.preventDefault(); } }
    else if(['arrowright','d'].includes(k)){ if(active){ pressDir('right'); e.preventDefault(); } }
    else if(k===' '){ e.preventDefault(); if(running&&!paused){ boosting=true; boostTouch=false; } }
    else if(k==='p'||k==='escape'){ e.preventDefault(); if(running){ paused?resumeGame():pauseGame(); } }
  });
  window.addEventListener('keyup',e=>{
    const k=e.key.toLowerCase();
    if(['arrowup','w'].includes(k)) releaseDir('up');
    else if(['arrowdown','s'].includes(k)) releaseDir('down');
    else if(['arrowleft','a'].includes(k)) releaseDir('left');
    else if(['arrowright','d'].includes(k)) releaseDir('right');
    else if(k===' ') { boosting=false; boostTouch=false; }
  });

  // 触屏滑动：每次滑动设定一个方向（不叠加，最后滑动的方向保持生效）
  let tsx=0,tsy=0;
  canvas.addEventListener('touchstart',e=>{const t=e.touches[0];tsx=t.clientX;tsy=t.clientY;},{passive:true});
  canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
  canvas.addEventListener('touchend',e=>{
    const t=e.changedTouches[0], dx=t.clientX-tsx, dy=t.clientY-tsy;
    if(Math.abs(dx)<15&&Math.abs(dy)<15) return;
    if(Math.abs(dx)>Math.abs(dy)) heldDirs=[dx>0?'right':'left']; else heldDirs=[dy>0?'down':'up'];
  },{passive:true});

  // 右下角冲刺按钮：按住即冲刺（对应键盘空格）；用指针捕获保证手指滑出按钮也能正确松开
  const sprintBtn=document.getElementById('btnSprint');
  if(sprintBtn){
    sprintBtn.addEventListener('pointerdown',e=>{
      e.preventDefault();
      try{ sprintBtn.setPointerCapture(e.pointerId); }catch(_){}
      if(running&&!paused){ boosting=true; boostTouch=true; }
    });
    sprintBtn.addEventListener('pointerup',e=>{ e.preventDefault(); boosting=false; boostTouch=false; });
    sprintBtn.addEventListener('pointercancel',()=>{ boosting=false; boostTouch=false; });
    sprintBtn.addEventListener('contextmenu',e=>e.preventDefault());
  }

  /* ---------- 界面绑定 ---------- */
  function bind(id,fn){ const el=document.getElementById(id); el.addEventListener('click',()=>{fn();el.blur();}); }

  bind('btnStart',gotoMode);
  bind('btnColor',gotoColors);
  bind('btnItems',()=>showOverlay('ovItems'));
  bind('btnItemsBack',gotoMenu);
  bind('btnModeBack',gotoMenu);
  bind('btnCampaign',gotoLevels);
  bind('btnEndless',startEndless);
  bind('btnLevelsBack',gotoMode);
  bind('btnColorsBack',gotoMenu);
  bind('btnResume',resumeGame);
  bind('btnPauseQuit',gotoMenu);
  bind('btnPause',pauseGame);

  function renderLevels(){
    const wrap=document.getElementById('levelGrid'); wrap.innerHTML='';
    for(let i=1;i<=10;i++){
      const b=document.createElement('button');
      b.className='lvl-btn'+(i>unlocked?' locked':'');
      b.textContent=i;
      if(i<=unlocked) b.onclick=()=>startCampaign(i,false);
      else b.disabled=true;
      wrap.appendChild(b);
    }
  }
  function renderColors(){
    const wrap=document.getElementById('colorGrid'); wrap.innerHTML='';
    SCHEMES.forEach(s=>{
      const b=document.createElement('button');
      b.className='color-btn'+(s.id===currentScheme.id?' active':'');
      b.innerHTML='<span class="dot" style="background:'+s.head+';color:'+s.head+'"></span>'+s.name;
      b.onclick=()=>{ currentScheme=s; localStorage.setItem('snake_color',s.id); renderColors(); };
      wrap.appendChild(b);
    });
    drawColorPreview();
  }

  /* ---------- 启动 ---------- */
  gotoMenu();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
