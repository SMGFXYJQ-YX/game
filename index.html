<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>扫雷</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --cell:#4a5568; --cell-hi:#5a6678;
    --rev:#1a202c; --rev-line:#2d3748; --accent:#ff4d4d; --txt:#e6edf3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:radial-gradient(circle at 50% -10%, #1b2330, var(--bg) 60%);
    color:var(--txt); font-family:-apple-system,system-ui,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    min-height:100%; padding:16px 10px 30px;
  }
  h1{font-size:34px; letter-spacing:6px; margin:14px 0 22px; font-weight:800;
     background:linear-gradient(90deg,#ff8a8a,#ff4d4d); -webkit-background-clip:text; background-clip:text; color:transparent;}
  h2{margin:0 0 16px; font-weight:700; letter-spacing:2px;}

  /* ---------- 主界面 / 自定义 overlay ---------- */
  .overlay{display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; max-width:360px;}
  .overlay.hidden{display:none;}
  .menu-btn{
    width:100%; padding:15px 18px; font-size:16px; font-weight:600; cursor:pointer;
    color:var(--txt); background:linear-gradient(180deg,#2b3442,#1d2530);
    border:1px solid #374151; border-radius:14px; transition:.15s;
    display:flex; justify-content:space-between; align-items:center;
  }
  .menu-btn small{opacity:.7; font-weight:400; font-size:13px;}
  .menu-btn:hover{border-color:var(--accent); transform:translateY(-1px); box-shadow:0 6px 18px rgba(255,77,77,.15);}
  .menu-btn.hard{background:linear-gradient(180deg,#3a2030,#241419); border-color:#5b2a3a;}
  .menu-btn.hard:hover{border-color:#ff4d4d; box-shadow:0 6px 18px rgba(255,77,77,.25);}

  .field{display:flex; flex-direction:column; gap:5px; width:100%;}
  .field label{font-size:13px; opacity:.85;}
  .field input{
    width:100%; padding:11px 12px; font-size:16px; border-radius:10px;
    border:1px solid #374151; background:#0d1117; color:var(--txt);
  }
  .field input:focus{outline:none; border-color:var(--accent);}
  .err{color:#ff8080; font-size:13px; min-height:18px; margin:2px 0 0;}
  .row{display:flex; gap:10px; width:100%;}
  .row .menu-btn{justify-content:center;}

  /* ---------- 游戏区 ---------- */
  #game{width:100%; max-width:640px; display:flex; flex-direction:column; align-items:center; gap:12px;}
  #game.hidden{display:none;}

  #hud{
    display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;
    background:var(--panel); border:1px solid #30363d; border-radius:14px;
    padding:12px 16px; width:100%;
  }
  .panel{display:flex; flex-direction:column; align-items:center; gap:5px;}
  .panel .lbl{font-size:11px; opacity:.7; letter-spacing:1px;}
  .face{
    font-size:24px; line-height:1; cursor:pointer; background:#21262d; border:1px solid #30363d;
    border-radius:10px; width:46px; height:46px; transition:.1s;
  }
  .face:active{transform:scale(.92);}

  .gamebar{display:flex; align-items:center; justify-content:space-between; width:100%; gap:10px;}
  .ghost-btn{cursor:pointer; background:transparent; border:1px solid #30363d; color:var(--txt);
    padding:8px 14px; border-radius:10px; font-size:14px;}
  .ghost-btn:hover{border-color:var(--accent);}
  #status{font-size:15px; font-weight:600; min-height:20px;}
  #status.win{color:#7ee787;} #status.lose{color:#ff7b72;}

  .board-wrap{overflow:auto; max-width:100%; padding:4px; border-radius:10px;}
  #board{display:grid; gap:0; background:var(--rev-line); border:2px solid #30363d; border-radius:6px;}

  .cell{
    display:flex; align-items:center; justify-content:center;
    font-weight:800; user-select:none; cursor:pointer;
    background:linear-gradient(180deg,var(--cell-hi),var(--cell));
    border:1px solid #2d3748; color:#fff;
  }
  .cell:active{filter:brightness(1.1);}
  .cell.revealed{background:var(--rev); border-color:var(--rev-line); cursor:default;}
  .cell.flag{color:#ffd34d;}
  .cell.mine{background:#5b2a2a;}
  .cell.boom{background:#ff4d4d; color:#fff;}
  .cell.wrong{background:#374151;}
  .n1{color:#58a6ff;} .n2{color:#7ee787;} .n3{color:#ff7b72;} .n4{color:#bc8cff;}
  .n5{color:#ffa657;} .n6{color:#56d4dd;} .n7{color:#e6edf3;} .n8{color:#8b949e;}

  /* ---------- 数字显示（普通数字） ---------- */
  .digi{font-family:'Courier New',ui-monospace,monospace; font-size:24px; font-weight:700;
    color:var(--accent); letter-spacing:2px; text-shadow:0 0 6px var(--accent);
    min-width:54px; text-align:center;}
</style>
</head>
<body>

  <!-- 主界面 -->
  <div id="ovMenu" class="overlay">
    <h1>扫雷</h1>
    <button class="menu-btn" data-d="easy">简单 <small>10×10 · 10 雷</small></button>
    <button class="menu-btn" data-d="medium">中等 <small>20×50 · 100 雷</small></button>
    <button class="menu-btn hard" data-d="hard">困难 <small>30×40 · 200 雷</small></button>
    <button class="menu-btn" data-d="custom">自定义 <small>自定长宽与雷数</small></button>
  </div>

  <!-- 自定义 -->
  <div id="ovCustom" class="overlay hidden">
    <h2>自定义</h2>
    <div class="field"><label>列数（宽，5–50）</label><input id="inW" type="number" min="5" max="50" value="16"></div>
    <div class="field"><label>行数（高，5–50）</label><input id="inH" type="number" min="5" max="50" value="16"></div>
    <div class="field"><label>雷数（1 – 宽×高-1）</label><input id="inM" type="number" min="1" value="40"></div>
    <p id="customErr" class="err"></p>
    <div class="row">
      <button class="menu-btn" id="btnCustomStart" style="justify-content:center">开始</button>
      <button class="menu-btn" id="btnCustomBack" style="justify-content:center">返回</button>
    </div>
  </div>

  <!-- 游戏 -->
  <div id="game" class="hidden">
    <div id="hud">
      <div class="panel"><div class="lbl">剩余雷</div><span class="digi" id="ledMines">000</span></div>
      <button class="face" id="btnReset">🙂</button>
      <div class="panel"><div class="lbl">已扫</div><span class="digi" id="ledCleared">000</span></div>
      <div class="panel"><div class="lbl">时间</div><span class="digi" id="ledTime">00:00</span></div>
    </div>
    <div class="gamebar">
      <button class="ghost-btn" id="btnMenu">← 主菜单</button>
      <span id="status"></span>
    </div>
    <div class="board-wrap"><div id="board"></div></div>
  </div>

<script>
(function(){
  "use strict";

  /* ===================== 状态 ===================== */
  let rows=0, cols=0, mines=0;
  let board=[];          // board[r][c] = {mine, revealed, flagged, adj}
  let cells=[];          // 对应的 DOM 元素
  let started=false;     // 是否已布雷（首点后）
  let over=false;        // 是否已结束（胜/负）
  let revealedCount=0, flagCount=0;
  let elapsed=0, timerId=null;
  let cellSize=26;
  let modeKey='easy';

  const $ = id=>document.getElementById(id);

  function pad2(n){ return String(n).padStart(2,'0'); }
  function fmtNum(n, len){
    if(n<0) return '-' + String(-n).padStart(Math.max(1,len-1),'0');
    return String(n).padStart(len,'0');
  }

  /* ===================== 难度配置 ===================== */
  const PRESETS = {
    easy:   {rows:10, cols:10, mines:10},
    medium: {rows:20, cols:50, mines:100},
    hard:   {rows:30, cols:40, mines:200}
  };

  /* ===================== 界面切换 ===================== */
  function show(what){
    $('ovMenu').classList.toggle('hidden', what!=='menu');
    $('ovCustom').classList.toggle('hidden', what!=='custom');
    $('game').classList.toggle('hidden', what!=='game');
  }

  /* ===================== 开始游戏 ===================== */
  function startGame(r, c, m, key){
    rows=r; cols=c; mines=m; modeKey=key;
    started=false; over=false; revealedCount=0; flagCount=0; elapsed=0;
    stopTimer();

    board=[];
    for(let i=0;i<rows;i++){
      const row=[];
      for(let j=0;j<cols;j++) row.push({mine:false, revealed:false, flagged:false, adj:0});
      board.push(row);
    }

    // 自适应格子尺寸
    const maxW = Math.min(window.innerWidth*0.92, 600);
    cellSize = Math.max(15, Math.min(30, Math.floor(maxW/cols)));

    renderBoard();
    $('status').textContent=''; $('status').className='';
    $('btnReset').textContent='🙂';
    updateHud();
    show('game');
  }

  function renderBoard(){
    const b=$('board');
    b.innerHTML='';
    b.style.gridTemplateColumns=`repeat(${cols}, ${cellSize}px)`;
    b.style.width = (cols*cellSize)+'px';
    cells=[];
    for(let i=0;i<rows;i++){
      const rrow=[];
      for(let j=0;j<cols;j++){
        const d=document.createElement('div');
        d.className='cell';
        d.style.width=cellSize+'px'; d.style.height=cellSize+'px';
        d.style.fontSize=Math.floor(cellSize*0.58)+'px';
        d.dataset.r=i; d.dataset.c=j;
        bindCell(d, i, j);
        b.appendChild(d);
        rrow.push(d);
      }
      cells.push(rrow);
    }
    b.oncontextmenu = e=>e.preventDefault();
  }

  /* ===================== 布雷（首点保护） ===================== */
  function key(r,c){ return r+','+c; }
  function placeMines(sr, sc){
    const all=[];
    for(let i=0;i<rows;i++) for(let j=0;j<cols;j++) all.push([i,j]);
    let avoid=new Set([key(sr,sc)]);
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      const nr=sr+dr, nc=sc+dc;
      if(nr>=0&&nr<rows&&nc>=0&&nc<cols) avoid.add(key(nr,nc));
    }
    let cand = all.filter(([r,c])=>!avoid.has(key(r,c)));
    if(cand.length < mines) cand = all.filter(([r,c])=>!(r===sr&&c===sc));
    // 洗牌取前 mines 个
    for(let i=cand.length-1;i>0;i--){
      const k=Math.floor(Math.random()*(i+1));
      [cand[i],cand[k]]=[cand[k],cand[i]];
    }
    for(let i=0;i<mines;i++){ const [r,c]=cand[i]; board[r][c].mine=true; }
    // 计算邻接雷数
    for(let i=0;i<rows;i++) for(let j=0;j<cols;j++){
      if(board[i][j].mine) continue;
      let n=0;
      for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
        const nr=i+dr, nc=j+dc;
        if(nr>=0&&nr<rows&&nc>=0&&nc<cols && board[nr][nc].mine) n++;
      }
      board[i][j].adj=n;
    }
  }

  /* ===================== 揭开 / 标记 ===================== */
  function inBounds(r,c){ return r>=0&&r<rows&&c>=0&&c<cols; }
  function neighbors(r,c){
    const out=[];
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      if(dr===0&&dc===0) continue;
      if(inBounds(r+dr,c+dc)) out.push([r+dr,c+dc]);
    }
    return out;
  }

  function reveal(r,c){
    const cell=board[r][c];
    if(cell.revealed||cell.flagged) return;
    cell.revealed=true; revealedCount++;
    paintCell(r,c);
    if(cell.adj===0){
      for(const [nr,nc] of neighbors(r,c)) reveal(nr,nc);
    }
  }

  function chord(r,c){
    const cell=board[r][c];
    if(cell.adj===0) return;
    let flags=0;
    for(const [nr,nc] of neighbors(r,c)) if(board[nr][nc].flagged) flags++;
    if(flags!==cell.adj) return;
    for(const [nr,nc] of neighbors(r,c)){
      const nb=board[nr][nc];
      if(nb.flagged||nb.revealed) continue;
      if(nb.mine){ lose(nr,nc); return; }
      reveal(nr,nc);
    }
  }

  function onLeftClick(r,c){
    if(over) return;
    const cell=board[r][c];
    if(cell.flagged) return;
    if(!started){ placeMines(r,c); started=true; startTimer(); }
    if(!cell.revealed){
      if(cell.mine){ lose(r,c); return; }
      reveal(r,c);
    } else {
      chord(r,c);
    }
    afterMove();
  }

  function onRightClick(r,c){
    if(over) return;
    const cell=board[r][c];
    if(cell.revealed) return;
    cell.flagged=!cell.flagged;
    flagCount += cell.flagged?1:-1;
    paintCell(r,c);
    updateHud();
  }

  function afterMove(){
    updateHud();
    checkWin();
  }

  /* ===================== 绘制格子 ===================== */
  function paintCell(r,c){
    const cell=board[r][c];
    const el=cells[r][c];
    el.className='cell';
    el.textContent='';
    if(cell.revealed){
      el.classList.add('revealed');
      if(cell.mine){
        el.classList.add('mine'); el.textContent='💣';
      } else if(cell.adj>0){
        el.classList.add('n'+cell.adj); el.textContent=cell.adj;
      }
    } else if(cell.flagged){
      el.classList.add('flag'); el.textContent='🚩';
    }
  }

  /* ===================== 胜负 ===================== */
  function lose(r,c){
    over=true; stopTimer();
    $('btnReset').textContent='😵';
    const st=$('status'); st.textContent='踩雷了！'; st.className='lose';
    for(let i=0;i<rows;i++) for(let j=0;j<cols;j++){
      const cell=board[i][j];
      if(cell.mine && !cell.flagged){ cell.revealed=true; paintCell(i,j); }
      if(!cell.mine && cell.flagged){ const el=cells[i][j]; el.classList.add('wrong'); el.textContent='❌'; }
    }
    cells[r][c].classList.add('boom');
  }

  function checkWin(){
    if(over) return;
    if(revealedCount === rows*cols - mines){
      over=true; stopTimer();
      $('btnReset').textContent='😎';
      const st=$('status');
      const t=`胜利！用时 ${pad2(Math.floor(elapsed/60))}:${pad2(elapsed%60)}`;
      const best=saveBest();
      st.textContent = best ? (t+' · 新纪录！') : t;
      st.className='win';
      // 自动给剩余雷插旗
      for(let i=0;i<rows;i++) for(let j=0;j<cols;j++){
        if(board[i][j].mine && !board[i][j].flagged){ board[i][j].flagged=true; paintCell(i,j); }
      }
      flagCount=mines; updateHud();
    }
  }

  function saveBest(){
    if(modeKey==='custom') return false; // 自定义不记纪录
    const k='ms_best_'+modeKey;
    const prev=parseInt(localStorage.getItem(k)||'0',10);
    if(prev===0 || elapsed<prev){ localStorage.setItem(k,String(elapsed)); return true; }
    return false;
  }

  /* ===================== HUD ===================== */
  function updateHud(){
    const remain = mines - flagCount;
    $('ledMines').textContent = fmtNum(remain, 3);
    $('ledCleared').textContent = fmtNum(revealedCount, revealedCount<1000?3:String(revealedCount).length);
    $('ledTime').textContent = pad2(Math.min(99,Math.floor(elapsed/60)))+':'+pad2(elapsed%60);
  }

  /* ===================== 计时 ===================== */
  function startTimer(){
    stopTimer();
    timerId=setInterval(()=>{ elapsed++; updateHud(); }, 1000);
  }
  function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

  /* ===================== 交互绑定 ===================== */
  function bindCell(el, r, c){
    el.addEventListener('click', ()=>{ if(longPressed){ longPressed=false; return; } onLeftClick(r,c); });
    el.addEventListener('contextmenu', e=>{ e.preventDefault(); onRightClick(r,c); });
    // 移动端长按标记
    el.addEventListener('touchstart', ()=>{
      longPressed=false;
      touchTimer=setTimeout(()=>{ longPressed=true; onRightClick(r,c); }, 380);
    }, {passive:true});
    el.addEventListener('touchend', ()=>{ clearTimeout(touchTimer); });
    el.addEventListener('touchmove', ()=>{ clearTimeout(touchTimer); }, {passive:true});
  }
  let touchTimer=null, longPressed=false;

  /* ===================== 事件 ===================== */
  document.querySelectorAll('#ovMenu .menu-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const d=btn.dataset.d;
      if(d==='custom'){ show('custom'); return; }
      const p=PRESETS[d];
      startGame(p.rows, p.cols, p.mines, d);
    });
  });

  $('btnCustomBack').addEventListener('click', ()=>show('menu'));
  $('btnCustomStart').addEventListener('click', ()=>{
    const w=parseInt($('inW').value,10), h=parseInt($('inH').value,10), m=parseInt($('inM').value,10);
    const err=$('customErr');
    if(!Number.isFinite(w)||!Number.isFinite(h)||!Number.isFinite(m)){ err.textContent='请填写有效数字'; return; }
    if(w<5||w>50||h<5||h>50){ err.textContent='宽和高需在 5–50 之间'; return; }
    if(m<1||m>w*h-1){ err.textContent='雷数需在 1 到 '+(w*h-1)+' 之间'; return; }
    err.textContent='';
    startGame(h, w, m, 'custom');
  });

  $('btnReset').addEventListener('click', ()=>{
    if(rows===0) return;
    startGame(rows, cols, mines, modeKey);
  });
  $('btnMenu').addEventListener('click', ()=>show('menu'));

  // 键盘：R 重开，Esc 回主菜单
  window.addEventListener('keydown', e=>{
    const k=e.key.toLowerCase();
    if($('game').classList.contains('hidden')) return;
    if(k==='r'){ startGame(rows,cols,mines,modeKey); }
    else if(k==='escape'){ stopTimer(); show('menu'); }
  });

  // 初始进入主界面
  show('menu');
})();
</script>
</body>
</html>
